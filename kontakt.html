<body>
    <!-- Common Header -->

        <section class="headerTitel">
            <h1>

        <nav>

    <main>

            <form action="result.html" method="GET" target="_blank" >

        <section class="contLinkSec">

            </section>
            <section id="contLinkedin" class="contLinks">
                <a href="">
                    <img src="images/linkedin_logo.png" alt="LinkedIn logo">

                </a>
            </section>
            <section id="contInstagram" class="contLinks">
